name: Build browser U-Net model
on:
  push:
    branches: [main]
    paths:
      - scripts/build_model.py
      - .github/workflows/build-model.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-browser-model
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow onnx==1.17.0 onnxruntime==1.20.1
      - run: python scripts/build_model.py
      - name: Commit generated model assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models static/vendor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build pinned concrete U-Net model for browser inference"
          git pull --rebase origin main
          git push origin main
